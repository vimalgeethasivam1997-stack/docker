
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/docker-flask-app

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 120
      runas: root

  BeforeInstall:
    - location: scripts/install_docker.sh
      timeout: 600
      runas: root

  AfterInstall:
    - location: scripts/start_container.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
